<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome — R.C. Langlands</title>
  <meta name="description" content="Thanks for joining the Seasons series mailing list." />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Lora:ital,wght@0,400;0,500;1,400&family=Nunito+Sans:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .welcome-page {
      min-height: 100vh;
      background: var(--forest-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      text-align: center;
    }
    .welcome-content { max-width: 480px; }
    .welcome-content .section-label { color: var(--forest-pale); }
    .welcome-content h1 {
      font-family: var(--serif);
      font-size: clamp(28px, 4vw, 40px);
      font-weight: 400;
      color: var(--forest-mist);
      line-height: 1.2;
      margin: 0.5rem 0 1rem;
    }
    .welcome-content p {
      font-family: var(--body);
      font-size: 16px;
      line-height: 1.75;
      color: rgba(212,232,214,0.75);
      margin: 0 0 2rem;
    }
    .welcome-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    @media (max-width: 480px) {
      .welcome-actions { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>

<div class="welcome-page">
  <div class="welcome-content">
    <div class="section-label">You're in</div>
    <h1>Welcome to the Seasons series</h1>
    <p>Grab a cup of tea and settle in — I'll be bringing you stories, notes from the writing desk, and news on the books as they take shape.</p>
    <div class="welcome-actions">
      <a href="index.html#journal" class="btn-primary">Read the Musings</a>
      <a href="index.html#books" class="btn-ghost">See the Books</a>
    </div>
  </div>
</div>

</body>
</html>
