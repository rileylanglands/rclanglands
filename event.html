<!DOCTYPE html>
<html lang="en">
<head>
  <script>if ('scrollRestoration' in history) { history.scrollRestoration = 'manual'; }</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event — R.C. Langlands</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Lora:ital,wght@0,400;0,500;1,400&family=Nunito+Sans:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="theme-color" content="#212e1a" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">R.C. Langlands</a>
  <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html#books">Books</a></li>
    <li><a href="index.html#about">About</a></li>
    <li><a href="index.html#journal">Musings</a></li>
    <li class="mobile-only"><a href="index.html#newsletter">Stay in the story</a></li>
  </ul>
  <a href="index.html#newsletter" class="nav-cta">Stay in the story</a>
</nav>

<div id="event-content">
  <!-- Loaded dynamically -->
</div>

<footer>
  <div class="footer-brand">R.C. Langlands</div>
  <div class="footer-links">
    <a href="privacy.html">Privacy</a>
    <a href="mailto:riley@rclanglands.com">Contact</a>
  </div>
  <div class="footer-copy">© 2026 R.C. Langlands. All rights reserved.</div>
</footer>

<script>
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  fetch('content/events.json')
    .then(r => r.json())
    .then(data => {
      const event = (data.events || []).find(e => e.id === id);
      const content = document.getElementById('event-content');

      if (!event) {
        content.innerHTML = `
          <div class="post-hero">
            <p style="color:rgba(168,201,172,0.6); font-family: var(--sans); font-size:14px;">Event details coming soon.</p>
          </div>`;
        return;
      }

      document.title = `${event.title} — R.C. Langlands`;

      const rsvpHTML = event.rsvpEmbed && event.rsvpEmbed.trim()
        ? `<div class="rsvp-embed">${event.rsvpEmbed}</div>`
        : `<p>RSVPs aren't open yet — check back soon, or
             <a href="mailto:riley@rclanglands.com?subject=RSVP:%20${encodeURIComponent(event.title)}">email to let me know you're coming</a>
             in the meantime.</p>`;

      content.innerHTML = `
        <div class="post-hero">
          <div class="post-tag">Book launch event</div>
          <h1 class="post-title">${event.title}</h1>
          <div class="post-date">${event.displayDate || event.date || ''}${event.location ? ' · ' + event.location : ''}</div>
        </div>
        <div class="post-body">
          ${event.bookId ? `<a href="book.html?id=${event.bookId}" class="back-link">← Back to the book</a>` : `<a href="index.html#books" class="back-link">← Back to the series</a>`}
          ${event.description ? `<p>${event.description}</p>` : ''}
          <div class="book-section">
            <h2>RSVP</h2>
            ${rsvpHTML}
          </div>
        </div>
      `;
    })
    .catch(() => {
      document.getElementById('event-content').innerHTML = `
        <div class="post-hero">
          <p style="color:rgba(168,201,172,0.6);">Unable to load this event.</p>
        </div>`;
    });
</script>

<script>
  // Mobile nav toggle
  const navToggle = document.getElementById('navToggle');
  const navLinks = document.getElementById('navLinks');
  navToggle.addEventListener('click', () => {
    const isOpen = navLinks.classList.toggle('open');
    navToggle.classList.toggle('open', isOpen);
    navToggle.setAttribute('aria-expanded', isOpen);
  });
  navLinks.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', () => {
      navLinks.classList.remove('open');
      navToggle.classList.remove('open');
      navToggle.setAttribute('aria-expanded', 'false');
    });
  });
</script>

</body>
</html>
