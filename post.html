<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Musings — R.C. Langlands</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Lora:ital,wght@0,400;0,500;1,400&family=Nunito+Sans:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">R.C. Langlands</a>
  <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html#books">Books</a></li>
    <li><a href="index.html#about">About</a></li>
  <li><a href="index.html#journal" class="back-link">Musings</a></li>
  </ul>
  <a href="index.html#newsletter" class="nav-cta">Stay in the story</a>
</nav>

<div id="post-content">
  <!-- Loaded dynamically -->
</div>

<footer>
  <div class="footer-brand">R.C. Langlands</div>
  <div class="footer-links">
    <a href="mailto:riley_lang@icloud.com">Contact</a>
  </div>
  <div class="footer-copy">© 2026 R.C. Langlands. All rights reserved.</div>
</footer>

<script>
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  fetch('posts/posts.json')
    .then(r => r.json())
    .then(posts => {
      const post = posts.find(p => p.id === id && p.published);
      if (!post) {
        document.getElementById('post-content').innerHTML = `
          <div class="post-hero">
            <p style="color:rgba(168,201,172,0.6); font-family: var(--sans); font-size:14px;">Post not found.</p>
          </div>`;
        return;
      }

      document.title = `${post.title} — R.C. Langlands`;

function formatInline(text) {
  return text
    .replace(/!\[(.*?)\]\((.*?)\)/g, '<img src="$2" alt="$1" loading="lazy">')
    .replace(/\[display\](.+?)\[\/display\]/g, '<span class="font-display">$1</span>')
    .replace(/\[sans\](.+?)\[\/sans\]/g, '<span class="font-sans">$1</span>')
    .replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/\n/g, '<br>');
}

function renderBlock(raw) {
  const text = raw.trim();
  const h3Match = text.match(/^###\s+(.*)$/);
  if (h3Match) return `<h3>${formatInline(h3Match[1])}</h3>`;
  const h2Match = text.match(/^##\s+(.*)$/);
  if (h2Match) return `<h2>${formatInline(h2Match[1])}</h2>`;
  const alignMatch = text.match(/^\[(center|left|right)\]([\s\S]*)\[\/\1\]$/);
  if (alignMatch) {
    return `<p style="text-align:${alignMatch[1]}">${formatInline(alignMatch[2].trim())}</p>`;
  }
  return `<p>${formatInline(text)}</p>`;
}

const paragraphs = post.content
  .split('\n\n')
  .filter(p => p.trim())
  .map(renderBlock)
  .join('\n');

      document.getElementById('post-content').innerHTML = `
        <div class="post-hero">
          <div class="post-tag">${post.tag}</div>
          <h1 class="post-title">${post.title}</h1>
          <div class="post-date">${formatDate(post.date)}</div>
        </div>
        <div class="post-body">
      <a href="index.html#journal" class="back-link">← Back to Musings</a>
          ${paragraphs}
        </div>
      `;
    })
    .catch(() => {
      document.getElementById('post-content').innerHTML = `
        <div class="post-hero">
          <p style="color:rgba(168,201,172,0.6);">Unable to load post.</p>
        </div>`;
    });

  function formatDate(d) {
    return new Date(d).toLocaleDateString('en-AU', { day: 'numeric', month: 'long', year: 'numeric' });
  }
</script>

<script>
  // Mobile nav toggle
  const navToggle = document.getElementById('navToggle');
  const navLinks = document.getElementById('navLinks');
  navToggle.addEventListener('click', () => {
    const isOpen = navLinks.classList.toggle('open');
    navToggle.classList.toggle('open', isOpen);
    navToggle.setAttribute('aria-expanded', isOpen);
  });
  navLinks.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', () => {
      navLinks.classList.remove('open');
      navToggle.classList.remove('open');
      navToggle.setAttribute('aria-expanded', 'false');
    });
  });
</script>

</body>
</html>
